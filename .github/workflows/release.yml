name: Release

on:
  push:
    tags: ["v*"]

# id-token: write is what lets npm verify this workflow's identity via OIDC —
# it is the reason no NPM_TOKEN secret is needed.
# contents: write is needed to create the GitHub Release.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag that disagrees with package.json would publish a version nobody
      # can find from the repository. Fail before anything is shipped.
      - name: Verify tag matches package.json version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg."
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          node scripts/changelog-section.js "${{ steps.version.outputs.version }}" > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build:ci

      - name: Test built bundle
        run: pnpm run test:dist

      # npm (not pnpm) is used for the publish step: the npm CLI has
      # first-class OIDC and provenance support, and pnpm has had regressions
      # here (pnpm/pnpm#11513). Everything else still runs through pnpm.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
